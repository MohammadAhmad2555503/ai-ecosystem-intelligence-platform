services:
  airflow-postgres:
    image: postgres:15
    container_name: ai-ecosystem-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: ai-ecosystem-airflow-init
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PROJECT_ROOT: /opt/airflow/project
      PIPELINE_EXECUTION_MODE: local
    volumes:
      - ./:/opt/airflow/project
      - ./airflow_dags:/opt/airflow/dags
    command: >
      bash -c "airflow db migrate &&
               airflow users create
               --username admin
               --password admin
               --firstname Admin
               --lastname User
               --role Admin
               --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: ai-ecosystem-airflow-webserver
    depends_on:
      - airflow-init
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PROJECT_ROOT: /opt/airflow/project
      PIPELINE_EXECUTION_MODE: local
    volumes:
      - ./:/opt/airflow/project
      - ./airflow_dags:/opt/airflow/dags
    ports:
      - "8081:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: ai-ecosystem-airflow-scheduler
    depends_on:
      - airflow-init
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PROJECT_ROOT: /opt/airflow/project
      PIPELINE_EXECUTION_MODE: local
    volumes:
      - ./:/opt/airflow/project
      - ./airflow_dags:/opt/airflow/dags
    command: scheduler

volumes:
  airflow_postgres_data:

